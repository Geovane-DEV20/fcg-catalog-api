apiVersion: v1
kind: Service
metadata:
  name: fcg-catalog-api-service
  labels:
    app: fcg-catalog-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: fcg-catalog-api
---
# Service para acesso externo (desenvolvimento/testes)
apiVersion: v1
kind: Service
metadata:
  name: fcg-catalog-api-nodeport
  labels:
    app: fcg-catalog-api
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30082
    protocol: TCP
    name: http
  selector:
    app: fcg-catalog-api
